<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="settings-link">
            <svg class="gear-icon" viewBox="0 0 24 24">
                <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
        </a>

        <div class="nav-center">
            <button class="nav-tab active" id="tabHome">Home</button>
            <button class="nav-tab" id="tabProfile">Profile</button>
        </div>

        <div class="theme-switch-container">
            <div class="theme-btn" id="themeToggle">
                <svg class="toggle-icon icon-sun" viewBox="0 0 24 24">
                    <path d="M12 6.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-6a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 12 2Zm0 16a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 12 18Zm-8-6a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5A.75.75 0 0 1 4 12Zm14 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5h-1.5a.75.75 0 0 1-.75-.75Zm-13.03-6.97a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06L4.97 6.09a.75.75 0 0 1 0-1.06Zm12.02 12.02a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06Zm-12.02 0a.75.75 0 0 1 0-1.06l1.06-1.06a.75.75 0 1 1 1.06 1.06l-1.06 1.06a.75.75 0 0 1-1.06 0Zm12.02-12.02a.75.75 0 0 1 0-1.06l1.06-1.06a.75.75 0 1 1 1.06 1.06l-1.06 1.06a.75.75 0 0 1-1.06 0Z"/>
                </svg>
                <svg class="toggle-icon icon-moon" viewBox="0 0 24 24">
                    <path d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z"/>
                </svg>
                <div class="theme-slider-knob"></div>
            </div>
        </div>
    </header>

    <main class="main-layout">
        <div class="page-content active" id="contentHome">
            <div class="welcome-container" id="welcomeContainer">
                <div class="welcome-block">
                    <h1 class="gradient-text">Flare Code AI.</h1>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-bar">
                    <button class="action-btn" aria-label="Attach files">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </button>
                    
                    <input type="text" class="chat-form-input" id="chatInput" placeholder="Нажмите на чат, чтобы написать промпт..." autocomplete="off" spellcheck="false">
                    
                    <div class="dropdown-selector">
                        <span>Build</span>
                        <svg viewBox="0 0 24 24">
                            <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                        </svg>
                    </div>

                    <button class="send-btn" aria-label="Send message">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="page-content" id="contentProfile">
            <div class="auth-container">
                <div class="auth-card">
                    <h2>Регистрация аккаунта</h2>
                    <p class="auth-subtitle">Выберите удобный способ авторизации для доступа к Flare Code AI</p>
                    
                    <div class="auth-methods">
                        <button class="auth-btn github-auth">
                            <svg viewBox="0 0 24 24" class="auth-icon">
                                <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                            </svg>
                            Войти через GitHub
                        </button>

                        <div class="auth-divider">
                            <span>или</span>
                        </div>

                        <div class="form-group">
                            <label for="authEmail">Электронная почта</label>
                            <input type="email" id="authEmail" class="auth-input" placeholder="name@example.com" autocomplete="off">
                        </div>

                        <button class="auth-btn email-auth">Продолжить по почте</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
        });

        const chatInput = document.getElementById('chatInput');
        const welcomeContainer = document.getElementById('welcomeContainer');

        chatInput.addEventListener('input', () => {
            if (chatInput.value.trim().length > 0) {
                welcomeContainer.classList.add('hidden');
            } else {
                welcomeContainer.classList.remove('hidden');
            }
        });

        const tabHome = document.getElementById('tabHome');
        const tabProfile = document.getElementById('tabProfile');
        const contentHome = document.getElementById('contentHome');
        const contentProfile = document.getElementById('contentProfile');

        tabHome.addEventListener('click', () => {
            tabProfile.classList.remove('active');
            tabHome.classList.add('active');
            contentProfile.classList.remove('active');
            contentHome.classList.add('active');
        });

        tabProfile.addEventListener('click', () => {
            tabHome.classList.remove('active');
            tabProfile.classList.add('active');
            contentHome.classList.remove('active');
            contentProfile.classList.add('active');
        });
    </script>
</body>
</html>
